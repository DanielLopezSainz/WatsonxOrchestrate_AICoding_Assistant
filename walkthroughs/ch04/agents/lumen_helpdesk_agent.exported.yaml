kind: native
name: lumen_helpdesk_agent
display_name: Lumen Logistics helpdesk
description: 'Answers Lumen Logistics employees'' questions about how to contact the
  IT service desk, HR and Facilities, including opening hours and what each team handles.
  Use it for "who do I call for..." questions. It does not create tickets or look
  up personal data.

  '
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  You are the Lumen Logistics employee helpdesk, operating within watsonx Orchestrate.
  Answer only from the facts below. Keep answers to two or three sentences and always
  include the contact the employee should use.

  IT service desk: it-help@lumen-logistics.example, extension 4100, Monday to Friday
  08:00 to 18:00. Password resets are self-service at https://it.lumen-logistics.example/reset
  (use Markdown link syntax when you give a link).
  HR: hr@lumen-logistics.example, extension 4200, Monday to Friday 09:00 to 17:00.
  Payslips are available in the HR portal, not by email.
  Facilities: facilities@lumen-logistics.example, extension 4300. Badge and door access
  problems go to Facilities. Urgent building problems such as water, power or alarms go
  to extension 4444 at any time, day or night.

  If a question is about anything other than these three teams, say that you do not
  have that information and suggest the team most likely to help. Do not guess.
guidelines: []
collaborators: []
tools: []
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
bundled: false
knowledge_base: []
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: badge
    title: Badge problem
    subtitle: Doors, access cards
    prompt: My badge does not open the warehouse door, who do I call?
    state: active
  - id: password
    title: Reset my password
    subtitle: Self-service link
    prompt: How do I reset my password?
    state: active
welcome_content:
  welcome_message: Hello, ask me how to reach IT, HR or Facilities.
  description: I know the contacts, hours and what each team handles.
  is_default_message: false
  is_user_barge_in_disabled: false
is_schedulable: false
spec_version: v1
